buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.application"

android {
    namespace = "com.tomasthrawat.gamearchitecture"
    compileSdk 36

    sourceSets {
        main {
            manifest.srcFile "AndroidManifest.xml"
            kotlin.srcDirs(["src/main/kotlin"])
            assets.srcDirs(["../app/src/main/assets"])
            res.srcDirs(["res"])
            jniLibs.srcDirs(["libs"])
        }
    }

    defaultConfig {
        applicationId "com.tomasthrawat.gamearchitecture"
        minSdk 21
        targetSdk 36
        versionCode 10
        versionName projectVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_8
        targetCompatibility JavaVersion.VERSION_8
        coreLibraryDesugaringEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false

            def storeFilePath = System.getenv("KEYSTORE_FILE")
            def storePasswordValue = System.getenv("KEYSTORE_PASSWORD")
            def keyAliasValue = System.getenv("KEY_ALIAS")
            def keyPasswordValue = System.getenv("KEY_PASSWORD")

            if (storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                signingConfig signingConfigs.create("ciRelease")
                signingConfigs.ciRelease.storeFile = file(storeFilePath)
                signingConfigs.ciRelease.storePassword = storePasswordValue
                signingConfigs.ciRelease.keyAlias = keyAliasValue
                signingConfigs.ciRelease.keyPassword = keyPasswordValue
            }
        }
    }

    packagingOptions {
        resources {
            excludes += [
                "META-INF/AL2.0",
                "META-INF/LGPL2.1"
            ]
        }
    }
}

configurations {
    natives
}

dependencies {
    implementation project(":core")
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"

    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
}

tasks.register("copyAndroidNatives") {
    doFirst {
        ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"].each {
            file("libs/$it").mkdirs()
        }

        configurations.natives.copy().files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("libs/armeabi-v7a")
            if (jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("libs/arm64-v8a")
            if (jar.name.endsWith("natives-x86.jar")) outputDir = file("libs/x86")
            if (jar.name.endsWith("natives-x86_64.jar")) outputDir = file("libs/x86_64")

            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include "*.so"
                }
            }
        }
    }
}

tasks.matching {
    it.name.contains("merge") && it.name.contains("JniLibFolders")
}.configureEach { task ->
    task.dependsOn("copyAndroidNatives")
}
