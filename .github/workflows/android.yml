name: libGDX Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libgdx-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Unit tests
        run: gradle --no-daemon test
      - name: Prepare Android natives
        run: gradle --no-daemon android:copyAndroidNatives
      - name: Build debug APK
        run: gradle --no-daemon android:assembleDebug
      - name: Build release APK
        run: gradle --no-daemon android:assembleRelease
      - name: Verify APK outputs
        run: |
          test -f android/build/outputs/apk/debug/android-debug.apk
          test -f android/build/outputs/apk/release/android-release-unsigned.apk
      - name: Upload APKs
        uses: actions/upload-artifact@v5
        with:
          name: Hyouka-libGDX-APKs
          path: |
            android/build/outputs/apk/debug/*.apk
            android/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30