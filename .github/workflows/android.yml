name: libGDX Android Debug Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libgdx-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: gradle --no-daemon test

      - name: Prepare Android natives
        run: gradle --no-daemon android:copyAndroidNatives

      - name: Build Debug APK
        run: gradle --no-daemon android:assembleDebug

      - name: Verify Debug APK
        run: |
          test -f android/build/outputs/apk/debug/android-debug.apk
          ls -lh android/build/outputs/apk/debug/android-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Hyouka-libGDX-Debug-APK
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
          retention-days: 30
